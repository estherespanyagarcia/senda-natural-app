name: Daily Content Generation

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && contains(github.event.schedule, '0 6'))
    runs-on: ubuntu-latest
    steps:
      - name: Trigger daily content generation
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://senda-natural-automatizacion-rrss.vercel.app/api/automation/generate-daily)
          echo "Response status: $response"
          if [ "$response" != "200" ]; then
            echo "Error: received status $response"
            exit 1
          fi

  check-video:
    if: github.event_name == 'schedule' && contains(github.event.schedule, '0 * * * *')
    runs-on: ubuntu-latest
    steps:
      - name: Check HeyGen video status
        run: |
          curl -s \
            -X GET \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}" \
            https://senda-natural-automatizacion-rrss.vercel.app/api/automation/check-video
